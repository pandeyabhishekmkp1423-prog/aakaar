      rel="stylesheet"
    />

    <!-- Theme initialization (Dark-First default, supports ?theme=light/dark) -->
    <script>
      (function () {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const themeParam = urlParams.get("theme");
          const stored = themeParam || localStorage.getItem("maple-theme");
          if (stored === "light") {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
          } else {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-canvas text-ink transition-colors duration-150">
